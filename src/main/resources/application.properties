spring.application.name=vr-booking

server.port=8080
server.servlet.context-path=/vr


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vr_booking?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:vruser}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
