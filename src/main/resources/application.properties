spring.application.name=vr-booking
server.port=${PORT:8080}
server.servlet.context-path=/vr

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vr_booking?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:vruser}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.threads.virtual.enabled=true

app.jwt.secret=${JWT_SECRET:VrDefaultDevelopmentSecretKeyMustBeAtLeast32BytesLong2026!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.seed.enabled=${SEED_ENABLED:true}
app.admin.email=${ADMIN_EMAIL:admin@test.vr}
app.admin.password=${ADMIN_PASSWORD:admin123}
